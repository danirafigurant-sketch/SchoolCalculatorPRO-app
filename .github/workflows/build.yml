name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and Build
        run: |
          npm install
          
          mkdir -p www
          cp index.html www/
          
          # 1. Создаем Android-проект
          npx cap add android
          npx cap sync android
          
          # 2. Генерируем иконки (теперь папка android уже существует)
          npx @capacitor/assets generate --android
          
          # 3. Принудительно очищаем старые иконки в ресурсах (если остались)
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher.png
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher_round.png
          cp -r resources/android/mipmap-* android/app/src/main/res/ 2>/dev/null || true
          
          # 4. Собираем APK
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-File
          path: android/app/build/outputs/apk/debug/app-debug.apk
