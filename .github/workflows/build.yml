name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and Build
        run: |
          # Ищем папку, где лежит package.json и переходим в неё
          FOUND_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          echo "Работаем в папке: $FOUND_DIR"
          cd "$FOUND_DIR"
          
          # Выполняем команды
          npm install
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-File
          # Ищем собранный APK
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
