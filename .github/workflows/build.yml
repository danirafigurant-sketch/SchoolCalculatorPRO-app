name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and Build
        run: |
          npm install
          
          # Копируем картинку в корень для index.html
          ICON_FILE=$(find resources -type f \( -name "*.jpg" -o -name "*.png" \) | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" icon.png
          fi
          
          mkdir -p www
          cp index.html www/
          cp icon.png www/
          
          npx cap add android
          npx cap sync android
          
          # --- ЗАМЕНА ИКОНКИ НА РАБОЧЕМ СТОЛЕ ---
          if [ -n "$ICON_FILE" ]; then
            cp "$ICON_FILE" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_FILE" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_FILE" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_FILE" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_FILE" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi
          # ---------------------------------------
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-File
          path: android/app/build/outputs/apk/debug/app-debug.apk
