name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - name: Install and Build
        run: |
          npm install
          mkdir -p www
          cp index.html www/
          npx cap add android
          npx cap sync android
          
          # --- ЖЕСТКАЯ ЗАМЕНА ИКОНКИ ---
          echo "Ищем картинку..."
          ICON_FILE=$(find resources -type f \( -name "*.jpg" -o -name "*.png" \) | head -n 1)
          
          if [ -z "$ICON_FILE" ]; then
            echo "ОШИБКА: Картинка не найдена в папке resources!"
            exit 1
          fi
          
          echo "Найдена картинка: $ICON_FILE"
          
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          rm -f android/app/src/main/res/mipmap-*/ic_launcher.*
          rm -f android/app/src/main/res/mipmap-*/ic_launcher_round.*
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          
          cp "$ICON_FILE" android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp "$ICON_FILE" android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp "$ICON_FILE" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          
          echo "Иконки успешно заменены!"
          # -----------------------------
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-File
          path: android/app/build/outputs/apk/debug/app-debug.apk
