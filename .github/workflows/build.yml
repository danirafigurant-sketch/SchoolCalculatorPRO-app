name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Обновил до 20, так как 18 устарел

    - name: Install Dependencies
      run: npm install

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Initialize Capacitor
      run: |
        npx cap init "Школьный калькулятор PRO" com.school.calculatorpro --web-dir ./
        npx cap add android

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-Pro-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
